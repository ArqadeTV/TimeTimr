name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  desktop:
    name: Build desktop app (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win -w electron
      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac -w electron
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux -w electron
      - uses: actions/upload-artifact@v4
        with:
          name: timetimr-${{ matrix.os }}
          path: |
            electron/release/*.exe
            electron/release/*.dmg
            electron/release/*.zip
            electron/release/*.AppImage
            electron/release/*.deb
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: timetimr-*
          path: dist-artifacts
          merge-multiple: true
      - name: Extract changelog section for this tag
        run: |
          awk -v ver="## ${GITHUB_REF_NAME}" '
            index($0, ver) == 1 { flag=1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}." > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: TimeTimr ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist-artifacts/**
          fail_on_unmatched_files: true
